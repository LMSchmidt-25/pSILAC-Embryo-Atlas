<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>pSILAC Embryo Atlas</title>

  <script src="./shinylive/load-shinylive-sw.js"
          type="module"></script>

  <script type="module">
    import { runExportedApp } from "./shinylive/shinylive.js";
    runExportedApp({
      id: "root",
      appEngine: "r",
      relPath: ""
    });
  </script>

  <link rel="stylesheet"
        href="./shinylive/style-resets.css" />
  <link rel="stylesheet"
        href="./shinylive/shinylive.css" />
</head>
<body>

<style>
#owl-loader {
  position: fixed;
  inset: 0;
  z-index: 999999;
  background: white;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  font-family: Arial, sans-serif;
}
#owl-loader video {
  width: min(340px, 80vw);
  max-height: 55vh;
}
#owl-loader p {
  color: #526174;
  font-size: 17px;
}
</style>

<div id="owl-loader">
  <video autoplay muted loop playsinline>
    <source src="./owl-loading.mp4" type="video/mp4">
  </video>
  <p>Loading pSILAC Embryo Atlas...</p>
</div>

<script>
(function () {
  const started = Date.now();

  function checkReady() {
    const root = document.getElementById("root");
    const loader = document.getElementById("owl-loader");
    if (!root || !loader) return;

    const frame = root.querySelector("iframe");
    let ready = false;

    if (frame) {
      try {
        ready = !!frame.contentDocument?.querySelector(
          ".shiny-bound-output"
        );
      } catch (e) {}
    }

    if (!ready) {
      ready = !!root.querySelector(".shiny-bound-output");
    }

    if (ready && Date.now() - started > 2500) {
      loader.remove();
    }
  }

  setInterval(checkReady, 500);
})();
</script>

  <div style="height: 100vh; width: 100vw"
       id="root"></div>
</body>
</html>
